# Local development / test environment. Not shipped in the plugin zip.
name: apipj-wp
services:
  db:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: wp
      MARIADB_USER: wp
      MARIADB_PASSWORD: wp
  wordpress:
    image: wordpress:php8.2-apache
    depends_on: [db]
    ports: ["8088:80"]
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wp
      WORDPRESS_DB_NAME: wp
      WORDPRESS_DEBUG: "1"
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_DEBUG_LOG', true );
        define( 'WP_DEBUG_DISPLAY', false );
    volumes:
      - wp:/var/www/html
      - ..:/var/www/html/wp-content/plugins/apipj-consulta-cnpj
      - ./mu-plugins:/var/www/html/wp-content/mu-plugins
  cli:
    image: wordpress:cli-php8.2
    depends_on: [wordpress]
    user: "33:33"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wp
      WORDPRESS_DB_NAME: wp
      HOME: /tmp
    volumes:
      - wp:/var/www/html
      - ..:/var/www/html/wp-content/plugins/apipj-consulta-cnpj
      - ./mu-plugins:/var/www/html/wp-content/mu-plugins
    entrypoint: ["sleep", "infinity"]
volumes:
  wp:
